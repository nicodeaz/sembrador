name: el-sembrador-web
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: el-sembrador-web:${SEMBRADOR_WEB_RELEASE:?Set a unique release name}
    container_name: el-sembrador-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
