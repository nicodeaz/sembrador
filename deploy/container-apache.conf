ServerName sembrador.okto.ie
ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    ServerName sembrador.okto.ie
    DocumentRoot /var/www/html
    # Origin is bound to loopback; Cloudflare Tunnel terminates HTTPS.
    SetEnv HTTPS on
    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} !^https$
    RewriteRule ^ https://sembrador.okto.ie%{REQUEST_URI} [R=301,L]
    <Directory /var/www/html>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
